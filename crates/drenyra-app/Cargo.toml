[package]
name = "drenyra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Drenyra GPUI native desktop host entrypoint and environment diagnostics"

[[bin]]
name = "drenyra-gpui"
path = "src/main.rs"

[features]
default = []
gpui = ["dep:gpui"]

[dependencies]
drenyra-protocol = { path = "../drenyra-protocol" }
drenyra-rpc = { path = "../drenyra-rpc" }
drenyra-ui = { path = "../drenyra-ui" }
drenyra-workspace = { path = "../drenyra-workspace" }
gpui = { version = "0.2.2", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
