# DEPRECATED: Legacy Tauri wrapper for apps/web.
# Drenyra GPUI is migrating to the native Rust + GPUI host in `crates/drenyra-app`
# (see `docs/architecture/drenyra-gpui-philosophy.md` for the phased retirement plan).

[package]
name = "drenyra-gpui"
version = "0.1.0"
description = "Drenyra GPUI — Legacy Tauri Shell (Deprecated; superseded by crates/drenyra-app)"
authors = ["Drenyra Team"]
edition = "2021"

[lib]
name = "drenyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
