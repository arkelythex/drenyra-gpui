[workspace]
resolver = "2"
members = [
    "crates/drenyra-protocol",
    "crates/drenyra-workspace",
    "crates/drenyra-rpc",
    "crates/drenyra-ui",
    "crates/drenyra-app",
]
exclude = [
    "apps/web/src-tauri",
    "vendor/rust/xattr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkelythex/drenyra-gpui"
authors = ["Arkelythex / Drenyra Team"]

# Temporary: xattr 0.2.3 (pulled in by gpui) does not build with libc >= 0.2.191 on Linux.
# See vendor/rust/xattr/PATCHED.md for the one-line fix and the removal condition.
[patch.crates-io]
xattr = { path = "vendor/rust/xattr" }
